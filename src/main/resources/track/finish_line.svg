<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="checker" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect x="0"  y="0"  width="50" height="50" fill="#000000"/>
      <rect x="50" y="0"  width="50" height="50" fill="#ffffff"/>
      <rect x="0"  y="50" width="50" height="50" fill="#ffffff"/>
      <rect x="50" y="50" width="50" height="50" fill="#000000"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="url(#checker)"/>
</svg>
